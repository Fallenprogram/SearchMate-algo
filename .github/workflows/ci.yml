name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: make gate
      - name: Lint release compatibility checker
        run: uv run ruff check .github/scripts/check_submission.py
      - name: Type-check research tooling
        run: uv run mypy --strict research/*.py .github/scripts/check_submission.py
      - name: Test player and research reliability
        run: uv run python -m unittest discover -s research -p 'test_*.py' -v

  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run python -m harness.arena --opponent baselines/random --games 2 --base-ms 5000
