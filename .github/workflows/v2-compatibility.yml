name: v2-01 Linux compatibility

on:
  push:
    branches: [codex/searchmate-v2-release]
    paths:
      - .github/scripts/check_v2_submission.py
      - .github/workflows/v2-compatibility.yml
      - research/releases/v2-01/release.json
      - research/releases/v2-01/player/agent.py
      - research/runs/v2-01/candidate/agent.py
  workflow_dispatch:
    inputs:
      expected_agent_sha256:
        description: Optional agent SHA-256; must match the committed v2-01 release record
        required: false
        default: ""
        type: string
      expected_zip_sha256:
        description: Optional ZIP SHA-256; must match the committed v2-01 release record
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Check the extracted v2-01 submission in a restricted Linux container
        env:
          EXPECTED_AGENT_SHA256: ${{ inputs.expected_agent_sha256 }}
          EXPECTED_ZIP_SHA256: ${{ inputs.expected_zip_sha256 }}
          RESULT_DIRECTORY: ${{ runner.temp }}/searchmate-v2-compatibility
        run: >-
          uv run --no-project --with chess==1.11.2 python
          .github/scripts/check_v2_submission.py
          --release-metadata research/releases/v2-01/release.json
          --expected-agent-sha256 "$EXPECTED_AGENT_SHA256"
          --expected-zip-sha256 "$EXPECTED_ZIP_SHA256"
          --output "$RESULT_DIRECTORY"
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-01-linux-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/searchmate-v2-compatibility/
          if-no-files-found: error
          retention-days: 90
